name: CI
on:
    pull_request: 
    push: 
        branches: [main]

permissions: 
    contents: read

concurrency: 
    cancel-in-progress: true
    group: ${{github.workflow}}-${{github.ref}}

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [24, 26]
            fail-fast: false
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                node-version: ${{matrix.node}}
                cache: npm
            
            - run: npm ci

            - run: npm run check
    